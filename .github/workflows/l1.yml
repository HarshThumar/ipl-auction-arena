name: L1 engine tests
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Tests that need private/ data skip themselves when it is absent (it is never in the repo).
      - run: python -m pytest -q
      - run: python scripts/run_auction.py --season 2026 --seed 1 --bidders valuation --out /tmp/run.jsonl
